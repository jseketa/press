{# One row of a post list. Arguments: post. #}
<li>
  <time datetime="{{ date(post.date, "%Y-%m-%d") }}">{{ date(post.date, "%b %Y") }}</time>
  <a class="post-list__title" href="{{ post.url }}">{{ post.title }}</a>
  {% if post.tags %}<span class="post-list__tags">{% for t in post.tags %}<span class="pill">{{ t }}</span>{% end %}</span>{% end %}
</li>
