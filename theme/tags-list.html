{% extend "base.html" title = "Tags - " + config.title, description = "Browse writing by tag." %}
<div class="wrap wrap--narrow">
  <section class="section rise">
    <div class="section-head">
      <h1>Tags</h1>
      <span class="rule"></span>
      <a class="more" href="{{ url("@/writing/_index.md") }}">all posts</a>
    </div>

    {% if site.tags %}
    <ul class="tag-cloud">
      {% for t in site.tags %}
      <li><a class="pill" href="{{ t.url }}">{{ t.name }} <span class="count">{{ len(t.pages) }}</span></a></li>
      {% end %}
    </ul>
    {% else %}<p class="empty">No tags yet.</p>{% end %}
  </section>
</div>
